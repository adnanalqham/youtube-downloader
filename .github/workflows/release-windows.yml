name: Build Windows App and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and prepare FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg-release.zip"
          Expand-Archive -Path "ffmpeg-release.zip" -DestinationPath "ffmpeg-extracted" -Force

          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-extracted" -Filter "ffprobe.exe" -File -Recurse | Select-Object -First 1

          if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "FFmpeg binaries were not found in the downloaded archive."
          }

          New-Item -ItemType Directory -Path "ffmpeg/bin" -Force | Out-Null
          Copy-Item $ffmpegExe.FullName "ffmpeg/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobeExe.FullName "ffmpeg/bin/ffprobe.exe" -Force

          $license = Get-ChildItem -Path "ffmpeg-extracted" -Filter "LICENSE*" -File -Recurse | Select-Object -First 1
          if ($license) {
            Copy-Item $license.FullName "ffmpeg/FFMPEG-LICENSE.txt" -Force
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name YouTubeDownloader --add-data "ffmpeg;ffmpeg" app.py

      - name: Package ZIP for users
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/YouTubeDownloader/*" -DestinationPath "dist/YouTubeDownloader-Windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: main
          name: YouTube Downloader ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: dist/YouTubeDownloader-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
